<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>thumb</title>
<style>
  html, body { margin: 0; }
  .frame {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: #111;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .frame.explainer { background: #F4EFE4; }
  img.bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: contrast(1.08) saturate(0.9);
  }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.15) 62%, transparent 100%);
  }
  .frame.explainer .shade { background: none; }
  .title {
    position: absolute;
    left: 56px; top: 160px;
    width: 700px;
    color: #fff;
    font-weight: 800;
    font-size: 92px;
    line-height: 0.92;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .frame.explainer .title { color: #1A1A1A; top: 180px; }
  .title em {
    font-style: normal;
    color: #C23B22;
  }
</style>
</head>
<body>
  <!-- Talking-head: keep .frame, set img src to the peeked face frame.
       Explainer: add class "explainer", optional still as img.bg. -->
  <div class="frame" data-title>
    <img class="bg" src="" alt="">
    <div class="shade"></div>
    <div class="title">YOU ARE<br><em>BARGAINING</em></div>
  </div>
</body>
</html>
