<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>evidence</title>
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    width: 980px;
    padding: 28px 36px 24px;
    background: #F4EFE4;
    border: 3px solid #1A1A1A;
    box-shadow: 8px 8px 0 #1A1A1A;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1A1A1A;
  }
  .meta {
    font-size: 18px;
    letter-spacing: 0.18em;
    font-weight: 700;
    text-transform: uppercase;
  }
  .meta span { color: #C23B22; }
  .finding {
    margin: 10px 0 8px;
    font-size: 34px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .venue { font-size: 16px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="meta">WILSON <span>2014</span></div>
    <div class="finding">People shocked themselves rather than sit alone with their thoughts.</div>
    <div class="venue">Science · University of Virginia</div>
  </div>
</body>
</html>
